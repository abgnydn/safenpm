# Cloudflare Pages configuration for the safenpm.dev backend.
#
# The static site lives in `site/` and the Pages Functions live in
# `functions/`. Cloudflare auto-discovers both layouts; this file just
# captures the project name, compatibility date, KV binding, and the
# env-var keys the functions expect so the deploy is reproducible from
# source instead of a dashboard click-through.
#
# Production secrets (ADMIN_SECRET) are NOT stored here. Provision with:
#   wrangler pages secret put ADMIN_SECRET --project-name=safenpm

name = "safenpm"
compatibility_date = "2025-09-23"
pages_build_output_dir = "site"

# Pages Functions inherit the project's compatibility date.
# `nodejs_compat` is required because some of our helpers expect
# Node-like globals (e.g. `Buffer` via base64).
compatibility_flags = ["nodejs_compat"]

# KV namespace for threat-intel persistence. Created with:
#   wrangler kv namespace create SAFENPM_KV
# Replaces the original Upstash Redis binding — Cloudflare-native,
# eliminates the third-party signup and stays inside the same auth
# boundary as the Pages project itself.
[[kv_namespaces]]
binding = "SAFENPM_KV"
id = "d8d743a19e704437aad649a3863311a5"

# Required secret (set via `wrangler pages secret put`):
#   ADMIN_SECRET — bearer token for /api/v1/admin
