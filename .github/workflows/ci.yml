name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 18 went EOL 2025-04; vitest 4 requires `node:util.styleText`
        # which is Node 20.12+. Drop 18 from the matrix.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: unit tests
        run: npm run test:unit

  golden:
    # The golden snapshots include the macOS-specific backend label
    # ("sandbox-exec (macOS)"). On Linux the same path produces
    # "firejail (Linux)" or "none", so the snapshots are platform-
    # locked by design. Linux + Windows would each need their own
    # captured snapshot set.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: golden snapshots
        run: bash test/golden/capture.sh --check

  integration:
    # Integration suite shells out to sandbox-exec (macOS) / firejail
    # (Linux). Required to pass — the previous SIGABRT flake was a
    # classifier bug, not an environmental issue, and is fixed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: integration tests
        run: bash test/run-tests.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
