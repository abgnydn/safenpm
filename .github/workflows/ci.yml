name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validates the TypeScript pipeline compiles cleanly. The bash test
      # runner (`bash test/run-tests.sh`, 89/90 currently passing) needs a
      # local sandboxed npm registry, so it stays a local-only check.
      - run: npm run build
