<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f1019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e1e2e" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5"/>
  <circle cx="220" cy="200" r="280" fill="url(#halo)"/>

  <!-- Shield + wordmark -->
  <g transform="translate(120, 110)">
    <!-- Shield -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="84" height="84" rx="20" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      <path d="M 42 16 L 64 26 V 44 C 64 58 52 68 42 70 C 32 68 20 58 20 44 V 26 Z" fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 32 42 L 39 49 L 53 35" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Wordmark -->
    <text x="110" y="58" font-size="54" font-weight="800" fill="#e4e4ef" letter-spacing="-1.5">safenpm</text>
    <text x="110" y="92" font-size="18" font-weight="500" fill="#8888a0" letter-spacing="0.3">sandboxed npm installs · v0.1.0</text>
  </g>

  <!-- Tagline -->
  <text x="120" y="240" font-size="40" font-weight="800" fill="#e4e4ef" letter-spacing="-1.2">Stop supply-chain attacks</text>
  <text x="120" y="288" font-size="40" font-weight="800" fill="url(#accent)" letter-spacing="-1.2">before they run.</text>

  <!-- Pill badges -->
  <g transform="translate(120, 322)" font-size="14" font-weight="500">
    <g transform="translate(0, 0)">
      <rect width="98" height="32" rx="16" fill="#12121a" stroke="#1e1e2e"/>
      <circle cx="18" cy="16" r="4" fill="#22c55e"/>
      <text x="32" y="21" fill="#e4e4ef">macOS</text>
    </g>
    <g transform="translate(108, 0)">
      <rect width="84" height="32" rx="16" fill="#12121a" stroke="#1e1e2e"/>
      <circle cx="18" cy="16" r="4" fill="#22c55e"/>
      <text x="32" y="21" fill="#e4e4ef">Linux</text>
    </g>
    <g transform="translate(202, 0)">
      <rect width="146" height="32" rx="16" fill="#12121a" stroke="#1e1e2e"/>
      <circle cx="18" cy="16" r="4" fill="#f59e0b"/>
      <text x="32" y="21" fill="#e4e4ef">Windows (experimental)</text>
    </g>
    <g transform="translate(358, 0)">
      <rect width="118" height="32" rx="16" fill="#12121a" stroke="#1e1e2e"/>
      <text x="59" y="21" text-anchor="middle" fill="#8888a0">zero deps · MIT</text>
    </g>
  </g>

  <!-- Terminal mock -->
  <g transform="translate(680, 86)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="14">
    <rect width="440" height="234" rx="12" fill="#12121a" stroke="#1e1e2e"/>
    <!-- traffic lights -->
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="40" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="6" fill="#22c55e"/>
    <text x="220" y="25" text-anchor="middle" font-size="12" fill="#555570">~ safenpm install</text>

    <!-- output lines -->
    <text x="20" y="64" fill="#8888a0">$</text>
    <text x="36" y="64" fill="#e4e4ef">safenpm install evil-pkg</text>

    <text x="20" y="92" fill="#06b6d4">→</text>
    <text x="36" y="92" fill="#8888a0">installing (scripts disabled)...</text>

    <text x="20" y="116" fill="#06b6d4">→</text>
    <text x="36" y="116" fill="#8888a0">static analysis of install scripts...</text>

    <text x="20" y="144" fill="#ef4444">✕ blocked</text>
    <text x="120" y="144" fill="#e4e4ef" font-weight="700">evil-pkg@0.0.1</text>
    <text x="40" y="166" fill="#555570">hook: postinstall</text>
    <text x="40" y="184" fill="#555570">reason: attempted network access</text>

    <text x="20" y="214" fill="#ef4444">1 blocked</text>
    <text x="100" y="214" fill="#e4e4ef">out of 1 install script</text>
  </g>
</svg>
